<!-- Versioned in strawberryjohn/zios_website: webflow/custom-code/ (capability-*.css) -->
<style>
/* Leistungsbereiche template: "Why ..." section (Figma 10052:14429).
   Page head of Capabilities (Template) 69bc155fa7556de240825b39 and the Leistungsbereiche CMS template 69e9ddef2088dcee56f16626. */

/* Vertical gradient. Figma: #002361 -> #0465cf. Start = swatch/blue-170.
   The end colour has no swatch yet; swatch/blue-130 (#1962b2) is the closest until one is signed off. */
.why_sec {
  background-image: linear-gradient(180deg, var(--swatch--blue-170) 0%, var(--swatch--blue-130) 100%);
}

/* Stats 2 and 3 are optional CMS fields: drop a column when its number is empty. */
.why_stat:has(> .why_stat_number.w-dyn-bind-empty) {
  display: none;
}

/* Capabilities page hero (wwdHero_* classes, Figma 10051:14295). Page head of Capabilities (Template)
   69bc155fa7556de240825b39 only, so the What we do hero (same classes) is not affected. */

/* Background pinned to the centre: it grows from the middle as the screen widens instead of
   anchoring to the bottom and drifting up. Capped at the 1920px content width. No transform here,
   the reveal tween owns transform. */
.wwdhero_bg {
  top: 0; right: 0; left: 0;
  margin-left: auto; margin-right: auto;
  max-width: 120rem;
  object-position: 50% 50%;
}

/* Blend where the image is cut by the section: bottom always, sides once the screen is wider
   than the 1920px image. Sits above the images, below the content (wwdHero_contain is z-index 1). */
.wwdhero_sec::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(180deg, transparent 72%, var(--swatch--blue-170) 100%);
}
@media (min-width: 120rem) {
  .wwdhero_sec::after {
    background:
      linear-gradient(180deg, transparent 72%, var(--swatch--blue-170) 100%),
      linear-gradient(90deg,
        var(--swatch--blue-170) calc(50% - 60rem),
        transparent calc(50% - 48rem),
        transparent calc(50% + 48rem),
        var(--swatch--blue-170) calc(50% + 60rem));
  }
}

/* Reveal (capability-hero-reveal.js): hidden until the timeline has set its start state. */
html.cap-reveal-pending .wwdhero_head > *,
html.cap-reveal-pending .wwdhero_content .button_primary_wrap { visibility: hidden; }
.wwdhero_line-mask { padding-bottom: 0.1em; margin-bottom: -0.1em; }

/* Partners marquee on the Capabilities page: capability-partners-marquee.js moves the whole track,
   so the per-group CSS animation from the "Partneres-logos / Animation" embed is switched off. */
.partners_component.is-js-marquee > .partners_list_wrap { animation: none !important; }
.partners_component.is-js-marquee { will-change: transform; }

/* "What you'll achieve" cards (Achieve section / Item component, Figma 10051:13115).
   Page head of Capabilities (Template) 69bc155fa7556de240825b39 and the Leistungsbereiche CMS template 69e9ddef2088dcee56f16626.
   The class itself (achieve_item) carries layout, the notched clip-path and a solid swatch/blue-100 fallback;
   the style API mangles var() inside gradients, so the gradient lives here. */

/* Card fill. Figma: #0465cf -> #0c76ea (no swatches); swatch/blue-130 -> swatch/blue-100 until signed off. */
.achieve_item {
  background-image: linear-gradient(180deg, var(--swatch--blue-130) 0%, var(--swatch--blue-100) 100%);
}

/* Visual box: Figma = #2289fb at 25% + 20% dot pattern. */
.achieve_visual_wr {
  background-color: color-mix(in srgb, var(--swatch--blue-100) 25%, transparent);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--swatch--white-100) 20%, transparent) 0.0625rem, transparent 0.075rem);
  background-size: 0.45rem 0.45rem;
}

/* Number label reads "[ 01 ]". */
.achieve_item_number::before { content: "[ "; }
.achieve_item_number::after { content: " ]"; }
</style>
<script>
/* Reveal guard: hide the hero text until capability-hero-reveal.js runs; show it anyway after 3s. */
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var d = document.documentElement;
  d.classList.add('cap-reveal-pending');
  setTimeout(function () { d.classList.remove('cap-reveal-pending'); }, 3000);
})();
</script>
