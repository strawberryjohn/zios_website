<!-- HOME REDESIGN: expertise slider (versioned in strawberryjohn/zios_website: webflow/custom-code/home-expertise-slider.js) -->
<script>
// Expertise slider (Home): endless loop in both directions + auto-advancing tab bar.
// Lives in the Home page footer custom code, after app.js and site-wide Swiper 12.
window.addEventListener('load', function () {
  var root = document.querySelector('[swiper="expertise-v2"]');
  if (!root || typeof Swiper === 'undefined') return;
  var el = root.querySelector('.swiper.expertise');
  if (el.swiper) el.swiper.destroy(true, true);

  // Only 3 slides: clone them once so the loop has enough slides to wrap seamlessly.
  var wrapper = el.querySelector('.swiper-wrapper');
  var originals = Array.prototype.slice.call(wrapper.children);
  var count = originals.length;
  originals.forEach(function (slide) {
    var clone = slide.cloneNode(true);
    clone.setAttribute('aria-hidden', 'true');
    wrapper.appendChild(clone);
  });

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var delay = 6000;
  root.style.setProperty('--expertise-autoplay', delay + 'ms');
  var tabs = Array.prototype.slice.call(root.querySelectorAll('.tab_button_item'));
  root.querySelectorAll('.expertise_nav_btn a').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });

  var swiper = new Swiper(el, {
    loop: true,
    slidesPerView: 'auto',
    centeredSlides: true,
    spaceBetween: 24,
    speed: 700,
    grabCursor: true,
    autoplay: reduceMotion ? false : { delay: delay, disableOnInteraction: false },
    navigation: {
      prevEl: root.querySelector('.expertise_nav_btn.prev'),
      nextEl: root.querySelector('.expertise_nav_btn.next')
    }
  });

  function syncTabs() {
    var active = swiper.realIndex % count;
    tabs.forEach(function (tab, i) {
      tab.classList.remove('is-active');
      tab.setAttribute('aria-pressed', i === active ? 'true' : 'false');
    });
    void root.offsetWidth; // restart the progress animation
    if (tabs[active]) tabs[active].classList.add('is-active');
  }
  swiper.on('slideChange', syncTabs);
  syncTabs();

  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () {
      swiper.slideToLoop(i);
      if (swiper.autoplay && swiper.autoplay.start) swiper.autoplay.start();
    });
  });
});
</script>
