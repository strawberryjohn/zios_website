<style>
/* Leistungsbereiche template: "Why ..." section (Figma 10052:14429).
   Page head of Capabilities (Template) 69bc155fa7556de240825b39 and the Leistungsbereiche CMS template 69e9ddef2088dcee56f16626. */

/* Vertical gradient. Figma: #002361 -> #0465cf. Start = swatch/blue-170.
   The end colour has no swatch yet; swatch/blue-130 (#1962b2) is the closest until one is signed off. */
.why_sec {
  background-image: linear-gradient(180deg, var(--swatch--blue-170) 0%, var(--swatch--blue-130) 100%);
}

/* Stats 2 and 3 are optional CMS fields: drop a column when its number is empty. */
.why_stat:has(> .why_stat_number.w-dyn-bind-empty) {
  display: none;
}

/* "What you'll achieve" cards (Achieve section / Item component, Figma 10051:13115).
   Page head of Capabilities (Template) 69bc155fa7556de240825b39 and the Leistungsbereiche CMS template 69e9ddef2088dcee56f16626.
   The class itself (achieve_item) carries layout, the notched clip-path and a solid swatch/blue-100 fallback;
   the style API mangles var() inside gradients, so the gradient lives here. */

/* Card fill. Figma: #0465cf -> #0c76ea (no swatches); swatch/blue-130 -> swatch/blue-100 until signed off. */
.achieve_item {
  background-image: linear-gradient(180deg, var(--swatch--blue-130) 0%, var(--swatch--blue-100) 100%);
}

/* Visual box: Figma = #2289fb at 25% + 20% dot pattern. */
.achieve_visual_wr {
  background-color: color-mix(in srgb, var(--swatch--blue-100) 25%, transparent);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--swatch--white-100) 20%, transparent) 0.0625rem, transparent 0.075rem);
  background-size: 0.45rem 0.45rem;
}

/* Number label reads "[ 01 ]". */
.achieve_item_number::before { content: "[ "; }
.achieve_item_number::after { content: " ]"; }
</style>
<style>
/* "What can I do" section (features_sec, Figma 10051:13075).
   Page head of Capabilities (Template) 69bc155fa7556de240825b39 and the Leistungsbereiche CMS template 69e9ddef2088dcee56f16626.
   JS: capability-features.js (page footer). */

/* No "+" icons (removed per review; the class is also display:none in the Designer). */
.features_sec .features_item_icon { display: none; }

/* Rows: buttons centre their text by default, so long titles wrapped centred. Left-align them. */
.features_sec .features_title_wr {
  justify-content: flex-start;
  text-align: left;
  cursor: pointer;
  background-color: transparent;
  transition: background-color 0.35s ease;
}
.features_sec .features_title { transition: color 0.35s ease; }
.features_sec .features_title_wr.is-active { background-color: var(--swatch--blue-10); }
.features_sec .features_title_wr.is-active .features_title { color: var(--swatch--blue-130); }

/* Panel copy: left-aligned like Figma (was centred). Image 521x247, 40px to the text,
   lead H5 Medium (Figma 22px, snapped to 24), 30px to the body, body 16px black-70. */
.features_sec .features__RT {
  width: 100%;
  max-width: 32.5rem;
  text-align: left;
}
/* Image spans the full text width, square corners. Webflow's rich text makes the figure's inner
   div inline-block (shrinks to the image) and caps the figure at the uploaded width, so both are reset. */
.features_sec .features__RT figure {
  display: block;
  width: 100%;
  max-width: 100% !important;
  margin: 0 0 2.5rem;
  padding: 0;
}
.features_sec .features__RT figure > div { display: block; width: 100%; padding: 0; }
.features_sec .features__RT figure img {
  display: block;
  width: 100%;
  max-width: none;
  height: auto;
  aspect-ratio: 521 / 247;
  object-fit: cover;
  border-radius: 0;
}
.features_sec .features__RT h1, .features_sec .features__RT h2, .features_sec .features__RT h3,
.features_sec .features__RT h4, .features_sec .features__RT h5, .features_sec .features__RT h6 {
  margin: 0 0 1.875rem;
  font-size: var(--_typography---font-size--h5, 1.5rem);
  font-weight: 500;
  line-height: 1.1;
  color: var(--swatch--black-100);
}
.features_sec .features__RT p {
  margin: 0 0 1.25rem;
  font-size: var(--_typography---font-size--h8, 1rem);
  line-height: 1.3;
  color: var(--swatch--black-70);
}
.features_sec .features__RT > :last-child { margin-bottom: 0; }

/* Panels: only the active one is visible. Before the script runs, the first one shows. */
.features_sec .features_content_wr { visibility: hidden; opacity: 0; }
.features_sec .features_item.is-active .features_content_wr,
.features_sec .features_list:not(.is-init) .features_item:first-child .features_content_wr { visibility: visible; opacity: 1; }

/* Tablet and up: two-column grid instead of absolutely positioned panels. All panels share the
   left cell, which spans every row, so the section grows to fit the tallest panel and the copy can
   no longer overflow into the next section or sit on top of another panel.
   --features-count is set by the script (row count = number of items). */
@media screen and (min-width: 768px) {
  .features_sec .features_list {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .features_sec .features_item { display: contents; }
  .features_sec .features_title_wr {
    grid-column: 2;
    border-left: 1px solid var(--swatch--black-20);
    border-bottom: 1px solid var(--swatch--black-20);
  }
  .features_sec .features_item:last-child .features_title_wr { border-bottom: 0; }
  .features_sec .features_content_wr {
    grid-column: 1;
    grid-row: 1 / span var(--features-count, 7);
    position: relative;
    inset: auto;
    width: auto;
    height: auto;
    padding: 4rem 2rem;
    justify-content: center;
    align-items: center;
    border-right: 0;
  }
}

/* Mobile: accordion, the active item's panel opens under its title. */
@media screen and (max-width: 767px) {
  .features_sec .features_content_wr { display: none; overflow: hidden; }
  .features_sec .features_item.is-active .features_content_wr,
  .features_sec .features_item.is-closing .features_content_wr,
  .features_sec .features_list:not(.is-init) .features_item:first-child .features_content_wr { display: flex; }
  .features_sec .features__RT { padding-top: 0.5rem; padding-bottom: 1.5rem; }
}

@media (prefers-reduced-motion: reduce) {
  .features_sec .features_title_wr, .features_sec .features_title { transition: none; }
}
</style>
