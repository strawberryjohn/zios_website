<script>
(function() {
  const BUBBLE_HIDDEN_KEY = 'chat_bubble_hidden';
  const COOKIES_ACCEPTED_KEY = 'cookiesAccepted';

  if (localStorage.getItem(COOKIES_ACCEPTED_KEY) === null) {
    localStorage.setItem(COOKIES_ACCEPTED_KEY, 'false');
  }
  const cookiesAccepted = localStorage.getItem(COOKIES_ACCEPTED_KEY) === 'true';
  
  const widget = document.querySelector('.chat_widget_wr');
  if (!widget) {
    console.log('Chat widget isnt found')
    return
  }
  
  const cookieBanner = document.getElementById('cookie-banner');
  const cookieCloseBtn = document.getElementById('cookie_close_btn');
  const acceptCookiesBtn = document.getElementById('accept-cookies');
  const declineCookiesBtn = document.getElementById('decline-cookies');
  const chatWidgetComponent = document.getElementById('chat_widget_component');
  const openBtn = widget.querySelector('.chat_widget_action_icon');
  const closeBtn = widget.querySelector('.chat_widget_close_wr');
  const chatBubbleEl = document.getElementById('chat-bubbleEl');
  const chatBubbleCloseEl = document.getElementById('chat-bubble-closeEl');
  
  // --- Cookie banner ---
  if (cookieBanner) {
    if (cookiesAccepted) {
      cookieBanner.classList.add('hide');
    } else {
      cookieBanner.classList.remove('hide');
    }
  }

  function closeBanner() {
    if (cookieBanner) cookieBanner.classList.add('hide');
  }

  if (cookieCloseBtn) {
    cookieCloseBtn.addEventListener('click', closeBanner);
  }

  if (acceptCookiesBtn) {
    acceptCookiesBtn.addEventListener('click', () => {
      localStorage.setItem(COOKIES_ACCEPTED_KEY, 'true');
      closeBanner();
      if (widget) chatWidgetComponent.classList.remove('hide');
    });
  }

  if (declineCookiesBtn) {
    declineCookiesBtn.addEventListener('click', closeBanner);
  }
  
  // --- Widget Component ---
  if (cookiesAccepted) {
    chatWidgetComponent.classList.remove('hide');
  } else {
    chatWidgetComponent.classList.add('hide');
  }
  
  // --- Chat widget Bubble ---
  function hideBubble() {
    if (!chatBubbleEl) return;
    chatBubbleEl.classList.add('hide');
    localStorage.setItem(BUBBLE_HIDDEN_KEY, 'true');
  }

  function initBubbleState() {
    if (!chatBubbleEl) return;
    if (localStorage.getItem(BUBBLE_HIDDEN_KEY) === 'true') {
      chatBubbleEl.classList.add('hide');
    }
  }

  if (chatBubbleCloseEl) {
    chatBubbleCloseEl.addEventListener('click', hideBubble);
  }

  initBubbleState();

  // --- Chat open/close ---
  function openChat() {
    widget.classList.add('is-open');
    if (chatBubbleEl && !chatBubbleEl.classList.contains('hide')) {
      hideBubble();
    }
  }
  
  function closeChat() {
    widget.classList.remove('is-open');
  }
  
  openBtn.addEventListener('click', openChat);
  closeBtn.addEventListener('click', closeChat);
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && widget.classList.contains('is-open')) {
      closeChat();
    }
  });
})();
</script>

<script>
window.addEventListener('load', function () {
  var root = document.querySelector('[data-expert]');
  if (!root || typeof Swiper === 'undefined') return;
  var el = root.querySelector('.expert_swiper');
  var wrapper = el.querySelector('.swiper-wrapper');
  var tabs = Array.prototype.slice.call(root.querySelectorAll('.expert_tab'));
  var prev = root.querySelector('.expert_nav.is-prev');
  var next = root.querySelector('.expert_nav.is-next');

  var originals = Array.prototype.slice.call(wrapper.children);
  var count = originals.length;
  originals.forEach(function (slide) {
    var clone = slide.cloneNode(true);
    clone.setAttribute('aria-hidden', 'true');
    wrapper.appendChild(clone);
  });

  function gap() {
    return 1.5 * parseFloat(getComputedStyle(document.documentElement).fontSize);
  }
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var swiper = new Swiper(el, {
    loop: true,
    slidesPerView: 'auto',
    centeredSlides: true,
    spaceBetween: gap(),
    speed: 800,
    grabCursor: true,
    autoplay: reduceMotion ? false : { delay: 6000, disableOnInteraction: false },
    navigation: { prevEl: prev, nextEl: next }
  });

  function fill(i, ratio) {
    var f = tabs[i] && tabs[i].querySelector('.expert_tab_fill');
    if (f) f.style.width = (ratio * 100).toFixed(2) + '%';
  }
  function syncTabs() {
    var active = swiper.realIndex % count;
    tabs.forEach(function (tab, i) {
      var on = i === active;
      tab.classList.toggle('is-active', on);
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
      fill(i, on && reduceMotion ? 1 : 0);
    });
  }
  swiper.on('slideChange', syncTabs);
  swiper.on('autoplayTimeLeft', function (s, ms, progress) {
    fill(swiper.realIndex % count, 1 - progress);
  });
  syncTabs();

  function activate(fn) {
    return function (e) {
      if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      fn();
    };
  }
  tabs.forEach(function (tab, i) {
    var go = activate(function () { swiper.slideToLoop(i); });
    tab.addEventListener('click', go);
    tab.addEventListener('keydown', go);
  });
  [[prev, 'slidePrev'], [next, 'slideNext']].forEach(function (p) {
    p[0].addEventListener('keydown', activate(function () { swiper[p[1]](); }));
  });

  var t;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(function () { swiper.params.spaceBetween = gap(); swiper.update(); }, 150);
  });
});
</script>

<!-- HOME REDESIGN: hero parallax scroll sequence (versioned in strawberryjohn/zios_website: webflow/custom-code/home-hero-parallax.js) -->
<script>
(function () {
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function ensureGsap() {
    var chain = Promise.resolve();
    if (typeof window.gsap === 'undefined') {
      chain = chain.then(function () { return loadScript('https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js'); });
    }
    return chain.then(function () {
      if (typeof window.ScrollTrigger === 'undefined') {
        return loadScript('https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js');
      }
    });
  }

  function init() {
    var sec = document.querySelector('.hero_sec');
    if (!sec || !sec.querySelector('.hero_layers')) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    gsap.registerPlugin(ScrollTrigger);

    function layer(n) { return sec.querySelector('.hero_layer.is-' + n); }
    var top = [sec.querySelector('.hero_head'), sec.querySelector('.button-wr.is-hero')].filter(Boolean);
    var bottom = sec.querySelector('.hero_bottom');
    var text = sec.querySelector('.hero_text');

    // Offset that puts hero_bottom's centre on the hero's centre, measured with
    // the text at its final 24px size and without the current transform.
    function centreOffset() {
      var tx = gsap.getProperty(bottom, 'x');
      var ty = gsap.getProperty(bottom, 'y');
      var prev = text.style.fontSize;
      text.style.fontSize = '1.5rem';
      var b = bottom.getBoundingClientRect();
      var s = sec.getBoundingClientRect();
      text.style.fontSize = prev;
      return {
        x: (s.left + s.width / 2) - (b.left - tx + b.width / 2),
        y: (s.top + s.height / 2) - (b.top - ty + b.height / 2)
      };
    }

    var tl = gsap.timeline({
      defaults: { ease: 'none' },
      scrollTrigger: {
        trigger: sec,
        start: 'top top',
        end: '+=200%',
        pin: true,
        scrub: 0.6,
        invalidateOnRefresh: true
      }
    });

    // Mountains: same duration, different distances = parallax.
    tl.to(layer(1), { yPercent: -160, duration: 0.75 }, 0)
      .to(layer(2), { yPercent: -140, duration: 0.75 }, 0)
      // Dark blue ground under layer 2 rises glued to it, so the gap below the mountains is dark blue, not sky.
      .to(sec.querySelector('.hero_layer.is-ground'), { y: function () { return -sec.clientHeight * 1.4; }, duration: 0.75 }, 0)
      .to(layer(3), { yPercent: -125, duration: 0.75 }, 0)
      .to(layer(4), { yPercent: -110, duration: 0.75 }, 0)
      .to(layer(5), { yPercent: -50, duration: 0.75 }, 0)
      .to(layer(5), { autoAlpha: 0, duration: 0.4 }, 0.35)
      // Heading + CTA move with the mountain they sit on (layer 2's speed).
      .to(top, { y: function () { return -sec.clientHeight * 1.4; }, duration: 0.75 }, 0)
      // Bottom group: to the centre, text 16 -> 24px.
      .to(bottom, {
        x: function () { return centreOffset().x; },
        y: function () { return centreOffset().y; },
        duration: 0.6,
        ease: 'power1.inOut'
      }, 0.15)
      .to(text, { fontSize: '1.5rem', duration: 0.6, ease: 'power1.inOut' }, 0.15)
      .to({}, { duration: 0.25 });
  }

  window.addEventListener('load', function () {
    ensureGsap().then(init).catch(function (e) { console.warn('Hero parallax skipped:', e); });
  });
})();
</script>
